  <div class="stats" style="margin-top:8px"><div class="st"><b>${G.pts}/${MAXP}</b>النقاط</div><div class="st"><b>${pct}%</b>النسبة</div><div class="st"><b>${stars}/3</b>النجوم</div></div>
  <div class="stats" style="margin-top:8px"><div class="st"><b>${ST.reduce((a,s)=>a+s.qs.length,0)}</b>أسئلة وأنشطة</div><div class="st"><b style="color:#16966f">${ok}</b>صحيحة من أول مرة</div><div class="st"><b style="color:#d9482f">${bad}</b>خاطئة في أول مرة</div></div>
  <div style="margin-top:8px">${rows}</div></div>
  <div class="card"><button class="big sun" data-a="cert">🎓 احصل على شهادتك</button><button class="big vio" data-a="lb">🏆 لوحة المتصدرين</button><button class="big" data-a="home">🔁 العب من جديد</button></div>`);snd('win');conf();fire(6)}
function cert(){
  G.dd=null;R('--a:#fff6d6;--b:#d6f3dc;--h:#3ea84a',`<div class="cert"><div style="font-size:2.4rem">🌍🌳⭐🌳🌍</div><h2>شهادة تقدير: بطل البيئة</h2><p style="margin:.2em">تُمنح هذه الشهادة إلى البطل/البطلة</p><div class="who">${esc(name)}</div>
  <p style="margin:.3em">لإكماله/ا لعبة «أبطال البيئة» عن التحديات البيئية في وطننا العربي</p><p style="margin:.3em;font-size:1.3rem"><b>الدرجة: ${G.pts} من ${MAXP}</b> &nbsp; <b>النسبة: ${G.pct}%</b></p><p style="margin:.3em">التاريخ: ${G.date}</p><div style="font-size:2rem">⭐⭐⭐</div></div>
  <div class="noprint card"><button class="big" data-a="print">🖨️ طباعة أو حفظ PDF</button><p class="hint" style="margin:0;font-size:.95rem">في نافذة الطباعة اختر «حفظ بصيغة PDF» من قائمة الطابعات.</p><button class="big vio" data-a="back">رجوع للنتيجة</button></div>`)}
function lb(){
  let a=[];try{a=JSON.parse(localStorage.getItem('eco_scores2')||'[]')}catch(e){}
  R('--a:#e4dcff;--b:#c9e8ff;--h:#7a63e0',`<div class="hero" style="margin-top:14px"><h1 style="font-size:2rem">🏆 لوحة المتصدرين</h1></div><div class="card">${a.length?a.slice(0,10).map((x,i)=>`<div class="row"><span>${['🥇','🥈','🥉'][i]||i+1+'.'} ${esc(x.n)}</span><b>${x.p}/${MAXP} (${x.c}%)</b></div>`).join(''):'لا توجد نتائج بعد. كن أول المتصدرين!'}
  <p style="font-size:.9rem;margin:8px 0 0">⚠️ هذه النتائج محفوظة على هذا الجهاز فقط ولا تظهر على أجهزة أخرى.</p><button class="big" data-a="home">رجوع</button></div>`)}

/* ================= التفاعل ================= */
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,i=+b.dataset.i,Q=G.s!=null&&G.i!=null&&ST[G.s]?cur():null,M=G.m;
  AC();if(a!=='pk'&&a!=='mok')snd('click');
  switch(a){
    case 'start':start();break;case 'retry':begin();break;case 'rs':resetStage();break;
    case 'acc':{const nv=$('#nm');if(nv)name=nv.value;acc=!acc;try{localStorage.setItem('eco_acc',acc?'1':'0')}catch(e){}home();const ab=$('[data-a=acc]');if(ab)ab.focus();say(acc?'تم تفعيل وضع ضعاف البصر. ستُقرأ الأسئلة والاختيارات والشرح بصوت عربي. اكتب اسمك ثم اضغط ابدأ المغامرة':'تم إيقاف وضع ضعاف البصر',1);break}case 'home':home();break;case 'lb':lb();break;case 'cert':cert();break;case 'back':finish();break;case 'print':window.print();break;
    case 'go':{G.s++;G.i=0;const p=G.s;showMap(p,p-1,()=>showQ(),'ابدأ المرحلة '+(p+1)+' ▶','أحسنت يا '+name+'! اجتزت المرحلة '+p+'. هيا إلى المرحلة '+(p+1));break}case 'fin':showMap(5,4,()=>finish(),'شاهد نتيجتك 🏅','رائع يا '+name+'! اجتزت كل المراحل ووصلت إلى الكأس');break;
    case 'mute':mute=!mute;if(mute&&window.speechSynthesis)speechSynthesis.cancel();document.querySelectorAll('[data-a=mute]').forEach(x=>x.textContent=mute?'🔇':'🔊');if(mute)toast('تم كتم الصوت 🔇');else{toast('تم تشغيل الصوت 🔊');snd('click');say('تم تشغيل الصوت',1)}break;
    case 'spk':say(qText(Q),1);break;
    case 'pk':pick(Q.t==='t'?b.dataset.v==='1':+b.dataset.v);break;
    case 'ml':if(G.lock||M.lock[i])return;if(M.map[i]!=null)delete M.map[i];else M.sel=M.sel===i?null:i;ans();if(acc&&M.sel===i)say('اخترت: '+Q.L[i]+'. اختر الآن ما يناسبه');break;
    case 'mr':{if(G.lock||M.lock[i])return;const o=Object.keys(M.map).find(l=>M.map[l]===i);
      const sl=M.sel;if(sl!=null){if(o!=null)delete M.map[o];M.map[sl]=i;M.sel=null}else if(o!=null)delete M.map[o];ans();if(acc)say(sl!=null?'تم توصيل '+Q.L[sl]+' بـ '+Q.R[i]:Q.R[i]);break}
    case 'mok':mok();break;
  }
});
addEventListener('resize',()=>{if(G.m&&$('#mt'))lines()});
try{acc=localStorage.getItem('eco_acc')==='1';}catch(e){}
try{speechSynthesis.getVoices();speechSynthesis.addEventListener('voiceschanged',()=>{})}catch(e){}
addEventListener('keydown',e=>{
  if(e.target.matches&&e.target.matches('input,textarea'))return;if($('#ov'))return;
  const k=e.key;
  if(/^[1-3١-٣]$/.test(k)){const bs=document.querySelectorAll('#ans [data-a=pk]'),n='123'.includes(k)?+k:'١٢٣'.indexOf(k)+1;if(bs[n-1]&&!bs[n-1].disabled){e.preventDefault();bs[n-1].click()}}
  else if(k==='r'||k==='R'||k==='ر'){if(G.s!=null&&ST[G.s]&&cur()&&$('#ans'))say(qText(cur()),1)}
});
home();
</script>
